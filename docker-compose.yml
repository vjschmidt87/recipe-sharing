services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-sharing-db
    environment:
      POSTGRES_DB: recipe_sharing
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5439:5432"
    volumes:
      - recipe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d recipe_sharing"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipe-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recipe-sharing-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recipe_sharing
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-cmVjaXBlc2hhcmluZ3NlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjEyMzQ1Njc4OTA=}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@recipesharing.com}
      SEED_CHEF_USERNAME: ${SEED_CHEF_USERNAME:-chef_maria}
      SEED_CHEF_PASSWORD: ${SEED_CHEF_PASSWORD:-chef_maria_pass}
      SEED_CHEF_EMAIL: ${SEED_CHEF_EMAIL:-maria@recipesharing.com}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8087/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - recipe-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recipe-sharing-frontend
    ports:
      - "4207:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - recipe-net

volumes:
  recipe_pgdata:
    name: recipe_pgdata

networks:
  recipe-net:
    driver: bridge
