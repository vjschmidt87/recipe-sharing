<div class="contact-page">
  <div class="contact-card">
    <h1>{{ t.t('contact.title') }}</h1>
    <p class="subtitle">{{ t.t('contact.subtitle') }}</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>{{ t.t('contact.name') }}</label>
        <input type="text" [(ngModel)]="name" name="name" required>
      </div>
      <div class="form-group">
        <label>{{ t.t('contact.email') }}</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label>{{ t.t('contact.subject') }}</label>
        <input type="text" [(ngModel)]="subject" name="subject" required>
      </div>
      <div class="form-group">
        <label>{{ t.t('contact.message') }}</label>
        <textarea [(ngModel)]="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn-send">{{ t.t('contact.send') }}</button>
    </form>
  </div>
</div>
