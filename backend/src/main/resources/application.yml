server:
  port: 8087

spring:
  datasource:
    url: jdbc:h2:mem:recipe_sharing
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:cmVjaXBlc2hhcmluZ3NlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjEyMzQ1Njc4OTA=}
    expiration-ms: 86400000
  seed:
    admin:
      username: ${SEED_ADMIN_USERNAME:admin}
      password: ${SEED_ADMIN_PASSWORD:admin123}
      email: ${SEED_ADMIN_EMAIL:admin@recipesharing.com}
    chef:
      username: ${SEED_CHEF_USERNAME:chef_maria}
      password: ${SEED_CHEF_PASSWORD:chef_maria_pass}
      email: ${SEED_CHEF_EMAIL:maria@recipesharing.com}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
