<div class="auth-page">
  <div class="auth-card">
    <h1>{{ t.t('auth.registerTitle') }}</h1>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>{{ t.t('auth.username') }}</label>
        <input type="text" [(ngModel)]="username" name="username" required>
      </div>
      <div class="form-group">
        <label>{{ t.t('auth.email') }}</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label>{{ t.t('auth.password') }}</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>
      <button type="submit" class="btn-submit">{{ t.t('auth.registerBtn') }}</button>
    </form>

    <p class="switch-link">
      {{ t.t('auth.hasAccount') }} <a routerLink="/login">{{ t.t('auth.loginBtn') }}</a>
    </p>
  </div>
</div>
