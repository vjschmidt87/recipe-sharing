<section class="hero">
  <div class="container">
    <h1>{{ t.t('home.title') }}</h1>
    <p>{{ t.t('home.subtitle') }}</p>
    <a routerLink="/recipes" class="btn-explore">{{ t.t('home.explore') }}</a>
  </div>
</section>

@if (featured.length) {
  <section class="featured container">
    <div class="section-header">
      <h2>{{ t.t('home.featuredTitle') }}</h2>
      <a routerLink="/recipes">{{ t.t('home.viewAll') }} →</a>
    </div>
    <div class="recipe-grid">
      @for (recipe of featured; track recipe.id) {
        <app-recipe-card [recipe]="recipe" />
      }
    </div>
  </section>
}
